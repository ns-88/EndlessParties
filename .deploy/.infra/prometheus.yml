global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-api-service
    static_configs:
      - targets: ["events-api-service:8080"]
    metrics_path: /metrics

  - job_name: bookings-api-service
    static_configs:
      - targets: ["bookings-api-service:8080"]
    metrics_path: /metrics

  - job_name: identity-api-service
    static_configs:
      - targets: ["identity-api-service:8080"]
    metrics_path: /metrics